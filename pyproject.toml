[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-vampire"
version = "0.0.1"
description = "Provider-neutral local LLM discovery, aggregation, routing, and orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "japer-technology" }]
keywords = ["llm", "ollama", "llama.cpp", "openai", "gateway", "orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "zeroconf>=0.131",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]
packaging = [
    "build==1.5.1",
    "pyinstaller==6.21.0",
]

[project.scripts]
vampire = "vampire.cli:main"
vampire-desktop = "vampire.desktop.launcher:main"

[project.urls]
Homepage = "https://github.com/japer-technology/llm-vampire"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vampire = ["assets/vampire-dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
