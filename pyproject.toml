[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstudio-vampire"
version = "0.0.1"
description = "Private AI compute, offered through LM Studio, wherever the owner allows it."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "japer-technology" }]
keywords = ["lmstudio", "llm", "openai", "gateway", "orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "zeroconf>=0.131",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vampire = "vampire.cli:main"

[project.urls]
Homepage = "https://github.com/japer-technology/lmstudio-vampire"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vampire = ["../../web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
