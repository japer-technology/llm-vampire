name: Build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing (must match project metadata)"
        required: true
        default: "0.0.1"
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra packaging
      - name: Validate version
        run: uv run --frozen python scripts/packaging/version.py --tag "$RELEASE_TAG"
      - name: Run quality gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy
          uv run --frozen pytest

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra packaging
      - name: Build Linux archive and Debian package
        run: |
          scripts/packaging/build-linux.sh
          scripts/packaging/build-ubuntu-deb.sh --reuse-linux-build
          uv run --frozen python scripts/packaging/validate-artifacts.py \
            dist --version "${RELEASE_TAG#v}" --platform linux
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-release-assets
          path: |
            dist/LLM-Vampire-*-linux-x86_64.tar.gz
            dist/LLM-Vampire-*-linux-x86_64.deb
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra packaging
      - name: Build macOS application
        run: |
          scripts/packaging/build-macos.sh
          uv run --frozen python scripts/packaging/validate-artifacts.py \
            dist --version "${RELEASE_TAG#v}" --platform macos
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-assets
          path: dist/LLM-Vampire-*-macos-x86_64.zip
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra packaging
      - name: Build Windows portable archive and installer
        shell: pwsh
        run: |
          .\scripts\packaging\build-windows.ps1
          $Version = $env:RELEASE_TAG.TrimStart("v")
          uv run --frozen python scripts/packaging/validate-artifacts.py `
            dist --version $Version --platform windows
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release-assets
          path: |
            dist/LLM-Vampire-*-windows-x86_64.exe
            dist/LLM-Vampire-*-windows-x86_64-portable.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: "*-release-assets"
          path: dist
          merge-multiple: true
      - name: Generate and validate checksums
        run: |
          python scripts/packaging/validate-artifacts.py \
            dist --version "${RELEASE_TAG#v}" --write-checksums
      - name: Create one release and upload separate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*
